<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABEDINEGO AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071b36, #164e63);
            color: white;
            text-align: center;
            padding: 25px 12px;
        }
        .box {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff18;
            border-radius: 18px;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: none;
            margin: 12px 0;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 16px;
        }
        #answer {
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🤖 ABEDINEGO AI</h1>
        <p>Murakaza neza! Welcome to my AI.</p>

        <input id="question" placeholder="Andika ikibazo cyawe...">

        <button onclick="sendMessage()">Ohereza</button>

        <p id="answer"></p>
    </div>

    <script>
        function sendMessage() {
            const q = document.getElementById("question")
                .value.trim().toLowerCase();
            const answer = document.getElementById("answer");

            if (!q) {
                answer.textContent = "Banza wandike ikibazo.";
            } else if (q.includes("muraho")) {
                answer.textContent = "Muraho neza! Ndi ABEDINEGO AI.";
            } else if (q.includes("witwa nde")) {
                answer.textContent = "Nitwa ABEDINEGO AI.";
            } else if (q.includes("amakuru")) {
                answer.textContent = "Ni meza! Wowe umeze ute?";
            } else {
                answer.textContent =
                    "Urakoze kubaza! Ubu ndacyari mu igerageza. " +
                    "Ntabwo ndashobora gusubiza ibibazo byose.";
            }
        }
    </script>
</body>
      </html>
